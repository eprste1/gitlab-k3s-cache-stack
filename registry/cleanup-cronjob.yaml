apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-cleanup
  namespace: registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-cleanup
  namespace: registry
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-cleanup
  namespace: registry
subjects:
  - kind: ServiceAccount
    name: registry-cleanup
    namespace: registry
roleRef:
  kind: Role
  name: registry-cleanup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-cache-cleanup
  namespace: registry
spec:
  # Every Sunday, 04:00
  # NOTE: only targets the kaniko cache-repo ("registry"). The three
  # pull-through mirrors (docker.io/gcr.io/ghcr.io) expire cached objects on
  # their own (registry:2 applies a fixed 168h TTL and ignores the proxy.ttl
  # key), so unused images disappear while actively-pulled ones stay cached.
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: registry-cleanup
          restartPolicy: Never
          containers:
            - name: gc
              # The official kubectl image is distroless (no shell), so kubectl is the command itself.
              # Pick the tag that matches the minor version of your cluster.
              image: registry.k8s.io/kubectl:v1.36.2
              command: ["kubectl"]
              args:
                - exec
                - deployment/registry
                - -n
                - registry
                - --
                - registry
                - garbage-collect
                - --delete-untagged=true
                - /etc/docker/registry/config.yml
