apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-cleanup
  namespace: registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-cleanup
  namespace: registry
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-cleanup
  namespace: registry
subjects:
  - kind: ServiceAccount
    name: registry-cleanup
    namespace: registry
roleRef:
  kind: Role
  name: registry-cleanup
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-cache-cleanup
  namespace: registry
spec:
  # Every Sunday, 04:00
  # NOTE: only targets the kaniko cache-repo ("registry"). The three
  # pull-through mirrors (docker.io/gcr.io/ghcr.io) self-clean via
  # proxy.ttl in their config.yml, so unused images expire on their own
  # while actively-pulled ones stay cached.
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: registry-cleanup
          restartPolicy: Never
          containers:
            - name: gc
              image: bitnami/kubectl:1.31
              command:
                - /bin/bash
                - -c
                - |
                  set -e
                  echo "Running garbage-collect on kaniko cache-repo (removes only untagged/orphaned blobs)..."
                  kubectl exec deployment/registry -n registry -- registry garbage-collect --delete-untagged=true /etc/docker/registry/config.yml
